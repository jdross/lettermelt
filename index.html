<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#170d16">
<meta name="format-detection" content="telephone=no">
<meta name="application-name" content="LetterMelt">
<meta name="description" content="Trace words. Melt the board. Beat the clock. LetterMelt is a fast, free word puzzle you can play and share with friends.">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<link rel="canonical" href="https://lettermelt.vercel.app/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="LetterMelt">
<meta property="og:title" content="LetterMelt — Trace Words. Melt the Board.">
<meta property="og:description" content="Beat the clock in a molten word puzzle, then challenge a friend to play the same board.">
<meta property="og:url" content="https://lettermelt.vercel.app/">
<meta property="og:image" content="https://lettermelt.vercel.app/assets/lettermelt-share-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="LetterMelt logo glowing over a playful connected letter board">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="LetterMelt — Trace Words. Melt the Board.">
<meta name="twitter:description" content="Beat the clock in a molten word puzzle, then challenge a friend to play the same board.">
<meta name="twitter:image" content="https://lettermelt.vercel.app/assets/lettermelt-share-card.png">
<meta name="twitter:image:alt" content="LetterMelt logo glowing over a playful connected letter board">

<title>LetterMelt — Trace Words. Melt the Board.</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "https://lettermelt.vercel.app/#website",
      "url": "https://lettermelt.vercel.app/",
      "name": "LetterMelt",
      "description": "Trace words. Melt the board. Beat the clock."
    },
    {
      "@type": "WebApplication",
      "@id": "https://lettermelt.vercel.app/#game",
      "name": "LetterMelt",
      "url": "https://lettermelt.vercel.app/",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript and a modern web browser",
      "isAccessibleForFree": true,
      "description": "A fast browser word game where players trace connected letters, melt solved words off the board, and race the clock.",
      "image": "https://lettermelt.vercel.app/assets/lettermelt-share-card.png"
    },
    {
      "@type": "FAQPage",
      "@id": "https://lettermelt.vercel.app/#faq",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do you play LetterMelt?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Drag through adjacent letters to make words of four or more letters, then release to submit. Letters can connect sideways, vertically, or diagonally, but a tile cannot be reused in one word."
          }
        },
        {
          "@type": "Question",
          "name": "What happens when you solve a word?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Letters and links that no remaining puzzle word needs melt away. Find every required word before the lava timer runs out."
          }
        },
        {
          "@type": "Question",
          "name": "What are bonus words in LetterMelt?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A valid dictionary word that is not required by the puzzle is a bonus word. Finding one puts time back on the clock."
          }
        }
      ]
    }
  ]
}
</script>
</head>
<body>

<div class="ambient" aria-hidden="true"><i class="glow-a"></i><i class="glow-b"></i><i class="glow-c"></i></div>

<div id="app">

  <header class="hud">
    <div class="hud-row">
      <div class="counter" id="counter">
        <span class="counter-nums"><b id="solvedCount">0</b> / <span id="totalCount">0</span></span>
        <span class="counter-label">words</span>
      </div>
      <div class="stars" id="stars" aria-label="Stars remaining"></div>
      <div class="hud-actions">
        <button class="btn-menu" id="menuButton" type="button" aria-label="Open game menu" aria-expanded="false">
          <span class="menu-dot" aria-hidden="true"></span>
          <span>Menu</span>
        </button>
      </div>
    </div>

    <!-- The clock as a vial of lava draining away: notches mark where each
         star goes, and reaching the end of the vial ends the run. -->
    <div class="vial" id="tube">
      <div class="vial-bore">
        <div class="vial-liquid" id="tubeFill" style="--fill: 1">
          <span class="vial-fill" aria-hidden="true"></span>
          <span class="vial-glow"></span>
          <span class="vial-bubbles" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </span>
          <span class="vial-edge" aria-hidden="true"><span class="vial-surface"></span></span>
        </div>
        <div class="vial-ticks" id="tubeTicks" aria-hidden="true"></div>
      </div>
      <span class="vial-glass" aria-hidden="true"></span>
      <span class="vial-time" id="timerValue">10:00</span>
      <div class="timer-toasts" id="timerToasts"></div>
    </div>

    <div class="current" id="current" aria-live="polite"><span class="current-text" id="currentText"></span>
      <span class="current-hint" id="currentHint"></span></div>
  </header>

  <main class="board-wrap">
    <svg id="board" class="board" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg" aria-label="Letter board"></svg>
  </main>

  <footer class="brand" aria-hidden="true">
    <img class="brand-logo" src="assets/lettermelt-logo.png" alt="LetterMelt">
  </footer>

  <div class="overlay menu-overlay" id="menuOverlay" hidden>
    <div class="menu-sheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
      <div class="menu-glow" aria-hidden="true"></div>
      <div class="menu-kicker">Game paused</div>
      <h1 class="menu-title" id="menuTitle">Take a breather</h1>
      <p class="menu-sub">Your lava timer is safely on ice.</p>

      <div class="menu-options">
        <div class="menu-option difficulty-option">
          <div class="menu-option-copy">
            <span class="menu-option-title" id="menuModeTitle">Switch to Easy</span>
            <span class="menu-option-detail" id="menuModeDetail">Try the easier word pool</span>
          </div>
          <button class="lava-switch" id="modeToggle" type="button" aria-label="Change difficulty" aria-pressed="false">
            <span class="switch-bubbles" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="switch-thumb" aria-hidden="true"></span>
            <span class="switch-label" id="modeLabel">Hard</span>
          </button>
        </div>

        <button class="menu-action" id="newGame" type="button">
          <span class="menu-action-icon" aria-hidden="true">↻</span>
          <span class="menu-action-copy"><strong>New game</strong><small>Pour a fresh board</small></span>
          <span class="menu-action-arrow" aria-hidden="true">›</span>
        </button>

        <button class="menu-action" id="openTutorial" type="button">
          <span class="menu-action-icon tutorial-menu-icon" aria-hidden="true">?</span>
          <span class="menu-action-copy"><strong>How to play</strong><small>Learn the molten basics</small></span>
          <span class="menu-action-arrow" aria-hidden="true">›</span>
        </button>

        <button class="menu-action" id="menuShare" type="button">
          <span class="menu-action-icon" aria-hidden="true">↗</span>
          <span class="menu-action-copy"><strong id="menuShareLabel">Share game</strong><small>Copy this puzzle link</small></span>
          <span class="menu-action-arrow" aria-hidden="true">›</span>
        </button>
      </div>

      <button class="menu-resume" id="resumeGame" type="button">Continue playing</button>
    </div>
  </div>

  <div class="overlay tutorial-overlay" id="tutorialOverlay" hidden>
    <div class="tutorial-sheet" role="dialog" aria-modal="true" aria-labelledby="tutorialTitle">
      <button class="tutorial-close" id="tutorialClose" type="button" aria-label="Back to game menu">×</button>
      <div class="tutorial-kicker">How to play</div>
      <h1 class="tutorial-title" id="tutorialTitle">Trace it. Melt it.</h1>
      <p class="tutorial-guide" id="tutorialGuide" aria-live="polite"></p>

      <div class="tutorial-board" id="tutorialBoard" aria-label="Tutorial letter board">
        <svg class="tutorial-links" id="tutorialLinks" viewBox="0 0 400 400" aria-hidden="true"></svg>
        <div class="tutorial-cells" id="tutorialCells"></div>
      </div>

      <div class="tutorial-word" id="tutorialWord" aria-live="polite"></div>
      <div class="tutorial-progress" id="tutorialProgress"></div>
      <div class="tutorial-controls">
        <button class="tutorial-back" id="tutorialBack" type="button">Back</button>
        <button class="tutorial-next" id="tutorialNext" type="button">Next</button>
      </div>
    </div>
  </div>

  <div class="overlay debug-overlay" id="debugOverlay" hidden>
    <div class="debug-sheet" role="dialog" aria-modal="true" aria-labelledby="debugTitle">
      <div class="debug-header">
        <div>
          <div class="debug-kicker">Developer view</div>
          <h1 class="debug-title" id="debugTitle">Current puzzle</h1>
        </div>
        <button class="debug-close" id="debugClose" type="button" aria-label="Close debug view">×</button>
      </div>
      <p class="debug-sub">Paused · press <kbd>D</kbd> to toggle this screen</p>
      <div class="debug-meta" id="debugMeta"></div>

      <section class="debug-section">
        <div class="debug-section-heading">
          <h2>Puzzle words</h2>
          <span id="debugWordCount"></span>
        </div>
        <ol class="debug-puzzle-words" id="debugWords"></ol>
      </section>

      <section class="debug-section">
        <div class="debug-section-heading">
          <h2>Common words on board</h2>
          <span id="debugCommonCount"></span>
        </div>
        <div class="debug-word-cloud" id="debugCommon"></div>
      </section>

      <button class="debug-done" id="debugDone" type="button">Back to game</button>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="sheet">
      <div class="sheet-burst" id="sheetBurst" aria-hidden="true"></div>
      <div class="sheet-brand"><img class="brand-logo" src="assets/lettermelt-logo.png" alt="LetterMelt"></div>
      <div class="sheet-emoji" id="sheetEmoji">🎉</div>
      <h1 class="sheet-title" id="sheetTitle">Solved!</h1>
      <div class="sheet-time" id="sheetTime">0:00</div>
      <p class="sheet-sub" id="sheetSub"></p>
      <div class="sheet-stars" id="sheetStars" aria-label="Stars earned"></div>
      <ul class="sheet-words" id="sheetWords"></ul>
      <button class="challenge-action" id="challengeAction" type="button">Share with friends</button>
      <button class="btn-primary" id="playAgain" type="button">Play again</button>
    </div>
  </div>

</div>

<script src="data/common.js"></script>
<script src="data/dict.js"></script>
<script src="js/generator.js"></script>
<script src="js/engine.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/share.js"></script>
<script src="js/main.js"></script>
</body>
</html>
